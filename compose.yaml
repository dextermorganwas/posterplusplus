services:
  mediaart-router:
    image: ghcr.io/REPLACE_ME/mediaart-router:latest
    container_name: mediaart-router
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ${CACHE_HOST_PATH:-./cache}:/app/cache
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.getenv('PORT','8000'), timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
